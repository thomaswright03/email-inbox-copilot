name: Model eval

# Scores the Gemini model and prompts against the golden sets (npm run eval)
# whenever the model id, a prompt, the spam response schema, the golden sets
# or the thresholds change, and weekly in case Google changes the model's
# behaviour under the same id. The job fails when any score is below its
# threshold in evals/scoring.ts, so a pull request that makes the model
# worse can't pass. Without the secrets below it is skipped with a warning.
#
# It needs two repository secrets (Settings -> Secrets and variables ->
# Actions): GEMINI_API_KEY, a key from the billing-enabled (paid tier)
# Google Cloud project, and GEMINI_PAID_TIER_PROJECT, that project's id.
# Only invented golden-set mail is sent; see evals/README.md.

on:
  pull_request:
    paths:
      - "lib/ai-prompts.ts"
      - "evals/**"
      - ".github/workflows/model-eval.yml"
  push:
    branches: [main]
    paths:
      - "lib/ai-prompts.ts"
      - "evals/**"
      - ".github/workflows/model-eval.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Until the owner adds the paid-tier secrets there is no model to score:
      # the job says so in a warning and skips the eval instead of failing
      # every pull request. Once the secrets exist, a score below threshold
      # fails the job.
      - name: Check the paid-tier Gemini secrets are set
        id: secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PAID_TIER_PROJECT: ${{ secrets.GEMINI_PAID_TIER_PROJECT }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$GEMINI_PAID_TIER_PROJECT" ]; then
            echo "::warning::Model eval skipped: the GEMINI_API_KEY and GEMINI_PAID_TIER_PROJECT repository secrets (paid-tier project) are not set. See evals/README.md."
            echo "## Model eval skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The paid-tier Gemini secrets are not set, so the model was not scored." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Score the model against the golden sets
        if: steps.secrets.outputs.present == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PAID_TIER_PROJECT: ${{ secrets.GEMINI_PAID_TIER_PROJECT }}
        run: npm run eval
